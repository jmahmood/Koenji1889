worker_processes 1;
pid /run/koenji-frontdoor/nginx.pid;
error_log stderr;
events { worker_connections 256; }
http {
    access_log off;
    client_body_temp_path /run/koenji-frontdoor/client;
    proxy_temp_path /run/koenji-frontdoor/proxy;
    fastcgi_temp_path /run/koenji-frontdoor/fastcgi;
    uwsgi_temp_path /run/koenji-frontdoor/uwsgi;
    scgi_temp_path /run/koenji-frontdoor/scgi;
    client_max_body_size 1m;
    proxy_http_version 1.1;
    proxy_set_header Host $http_host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_read_timeout 180s;
    server {
        listen 10.0.0.30:80 default_server;
        listen [::]:80 default_server ipv6only=on;
        server_name _;
        location / { proxy_pass http://127.0.0.1:8081; }
    }
    server {
        listen 10.0.0.30:80;
        server_name 1889.local;
        location / { proxy_pass http://10.0.0.30:8080; }
    }
}
