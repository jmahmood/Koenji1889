worker_processes 1;
pid /home/jawaad/koenji/nginx/nginx.pid;
error_log /home/jawaad/koenji/nginx/logs/error.log;
events { worker_connections 256; }
http {
    include /home/jawaad/koenji/tools/extracted/etc/nginx/mime.types;
    default_type application/octet-stream;
    access_log off;
    sendfile on;
    keepalive_timeout 15;
    client_body_temp_path /home/jawaad/koenji/nginx/temp/client;
    proxy_temp_path /home/jawaad/koenji/nginx/temp/proxy;
    fastcgi_temp_path /home/jawaad/koenji/nginx/temp/fastcgi;
    uwsgi_temp_path /home/jawaad/koenji/nginx/temp/uwsgi;
    scgi_temp_path /home/jawaad/koenji/nginx/temp/scgi;
    server {
        listen 10.0.0.30:8080;
        server_name raspberrypi.local raspberrypi 10.0.0.30;
        root /home/jawaad/koenji/www;
        index index.html;
        client_max_body_size 1m;
        add_header Referrer-Policy no-referrer always;
        add_header X-Content-Type-Options nosniff always;
        location = /test { return 404; }
        location ^~ /test/ { return 404; }
        location = /api/1889/dev { return 404; }
        location ^~ /api/1889/dev/ { return 404; }
        location /api/ {
            proxy_pass http://127.0.0.1:8789;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_read_timeout 180s;
            proxy_hide_header Access-Control-Allow-Origin;
            proxy_hide_header Access-Control-Allow-Methods;
            proxy_hide_header Access-Control-Allow-Headers;
            add_header Cache-Control no-store always;
        }
        location = /health {
            proxy_pass http://127.0.0.1:8789;
            proxy_hide_header Access-Control-Allow-Origin;
            add_header Cache-Control no-store always;
        }
        location ~ /\. { deny all; }
        location = /index.html { add_header Cache-Control no-cache always; }
        location /assets/ { try_files $uri =404; }
        location /music/ { try_files $uri =404; }
        location / { try_files $uri $uri/ /index.html; }
    }
}
