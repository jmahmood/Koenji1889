<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 240" width="800" height="960">
    <defs>
      <!-- 3D Volumetric Subsurface Face Gradient -->
      <radialGradient id="face-grad" cx="0.36" cy="0.32" r="0.65">
        <stop offset="0%" stop-color="#ffead6"/>
        <stop offset="48%" stop-color="#ecc19c"/>
        <stop offset="84%" stop-color="#b38059"/>
        <stop offset="100%" stop-color="#734b2e"/>
      </radialGradient>
      <linearGradient id="neck-grad" x1="0" y1="0" x2="1" y2="0.6">
        <stop offset="0%" stop-color="#ecc19c"/>
        <stop offset="60%" stop-color="#b38059"/>
        <stop offset="100%" stop-color="#734b2e"/>
      </linearGradient>
      <radialGradient id="spec-grad" cx="0.5" cy="0.5" r="0.5">
        <stop offset="0%" stop-color="#ffffff" stop-opacity="0.55"/>
        <stop offset="100%" stop-color="#ffead6" stop-opacity="0"/>
      </radialGradient>
      <radialGradient id="cheek-blush" cx="0.5" cy="0.5" r="0.5">
        <stop offset="0%" stop-color="#d97566" stop-opacity="0.32"/>
        <stop offset="100%" stop-color="#d97566" stop-opacity="0"/>
      </radialGradient>
      <linearGradient id="hair-grad" x1="0" y1="0" x2="0.3" y2="1">
        <stop offset="0%" stop-color="#6e4b35"/>
        <stop offset="35%" stop-color="#2e1e14"/>
        <stop offset="100%" stop-color="#0a0706"/>
      </linearGradient>
      <linearGradient id="frame-burgundy" x1="0" y1="0" x2="1" y2="1">
        <stop offset="0%" stop-color="#7a1e24"/>
        <stop offset="100%" stop-color="#1f1414"/>
      </linearGradient>
      <linearGradient id="lens-sheen" x1="0" y1="0" x2="1" y2="1">
        <stop offset="0%" stop-color="#ffffff" stop-opacity="0.18"/>
        <stop offset="50%" stop-color="#8cb8ff" stop-opacity="0.06"/>
        <stop offset="100%" stop-color="#000000" stop-opacity="0.08"/>
      </linearGradient>
      <filter id="soft-shadow" x="-10%" y="-10%" width="120%" height="120%">
        <feDropShadow dx="0" dy="3" stdDeviation="2.2" flood-color="#140b06" flood-opacity="0.55"/>
      </filter>
    </defs>

    <g id="photoreal-head-layer" transform="translate(0, 2)" filter="url(#soft-shadow)">
      
      <!-- Volumetric Neck with Jaw Cast Shadow -->
      <path d="M84 88 L84 114 Q100 124 116 114 L116 88 Z" fill="url(#neck-grad)" stroke="#734b2e" stroke-width="1.4"/>
      <path d="M85 92 Q100 112 115 95 L115 106 Q100 118 85 104 Z" fill="#734b2e" opacity="0.55"/>

      <!-- Detailed Ears with Inner Concha Shading -->
      <ellipse cx="66" cy="66" rx="6.2" ry="11.8" fill="url(#face-grad)" stroke="#734b2e" stroke-width="1.5"/>
      <path d="M65 61 Q63 66 66 71" fill="none" stroke="#734b2e" stroke-width="1.4" opacity="0.7"/>
      <ellipse cx="134" cy="66" rx="6.2" ry="11.8" fill="url(#face-grad)" stroke="#734b2e" stroke-width="1.5"/>
      <path d="M135 61 Q137 66 134 71" fill="none" stroke="#734b2e" stroke-width="1.4" opacity="0.7"/>

      <!-- 3D Shaded Cranium & Jaw -->
      <path d="M68 58 C68 18, 132 18, 132 58 C132 92, 118 109, 100 109 C82 109, 68 92, 68 58 Z" fill="url(#face-grad)" stroke="#734b2e" stroke-width="1.6"/>

      <!-- Subsurface Cheek & Nose Bridge Highlights -->
      <ellipse cx="79" cy="74" rx="11" ry="8" fill="url(#cheek-blush)"/>
      <ellipse cx="121" cy="74" rx="11" ry="8" fill="url(#cheek-blush)"/>
      <ellipse cx="80" cy="69" rx="7" ry="4" fill="url(#spec-grad)"/>
      <ellipse cx="120" cy="69" rx="7" ry="4" fill="url(#spec-grad)"/>

      <!-- Nasolabial & Eye Socket Volumetric Contours -->
      <path d="M88 76 Q83 83 84 91 M112 76 Q117 83 116 91" fill="none" stroke="#b38059" stroke-width="1.1" opacity="0.55" stroke-linecap="round"/>

      <!-- 3D Shaded Nose Bridge, Tip Highlight & Nostrils -->
      <path d="M97 56 L93 73 Q100 78 107 73 L103 56 Z" fill="#b38059" opacity="0.28"/>
      <path d="M100 55 L100 71" stroke="url(#spec-grad)" stroke-width="3.2" stroke-linecap="round"/>
      <circle cx="100" cy="71.5" r="2.8" fill="url(#spec-grad)"/>
      <path d="M93.5 73.5 Q96.5 76 98.5 74.5 M106.5 73.5 Q103.5 76 101.5 74.5" fill="none" stroke="#734b2e" stroke-width="1.6" stroke-linecap="round"/>

      
      <path d="M65 57 C60 22, 77 10, 100 11 C123 10, 140 22, 135 57 C132 39, 124 25, 100 24 C76 25, 68 39, 65 57 Z" fill="url(#hair-grad)"/>
      <path d="M72 24 Q86 15 102 18 T128 26" fill="none" stroke="#6e4b35" stroke-width="2.2" opacity="0.65" stroke-linecap="round"/>
      
      
      <path d="M71 46 C79 39, 90 41, 98 49 C89 44, 79 43, 71 46 Z" fill="#2e1e14"/>
      <path d="M131 46 C123 39, 112 41, 104 49 C113 44, 123 43, 131 46 Z" fill="#2e1e14"/>
      
    <!-- Sclera with realistic upper-lid shadow -->
    <path d="M76 62 Q85 55 94 62 Q85 67 76 62 Z" fill="#f7f2eb"/>
    <path d="M107 62 Q116 55 125 62 Q116 67 107 62 Z" fill="#f7f2eb"/>
    <!-- Multi-layered Iris & Pupil -->
    <circle cx="85.5" cy="61.5" r="4.3" fill="#2b190e"/>
    <circle cx="85.5" cy="61.5" r="3.1" fill="#4f2f1a"/>
    <circle cx="85.5" cy="61.5" r="1.8" fill="#0d0806"/>
    <circle cx="84.2" cy="60.2" r="1.2" fill="#ffffff" opacity="0.95"/>
    <circle cx="86.8" cy="62.8" r="0.6" fill="#ffffff" opacity="0.55"/>

    <circle cx="116.5" cy="61.5" r="4.3" fill="#2b190e"/>
    <circle cx="116.5" cy="61.5" r="3.1" fill="#4f2f1a"/>
    <circle cx="116.5" cy="61.5" r="1.8" fill="#0d0806"/>
    <circle cx="115.2" cy="60.2" r="1.2" fill="#ffffff" opacity="0.95"/>
    <circle cx="117.8" cy="62.8" r="0.6" fill="#ffffff" opacity="0.55"/>
    <!-- Upper & Lower Eyelid Creases -->
    <path d="M75 61 Q85 54 95 61" fill="none" stroke="#24140b" stroke-width="1.8" stroke-linecap="round"/>
    <path d="M76 58 Q85 52 94 58" fill="none" stroke="#b38059" stroke-width="0.9" opacity="0.7"/>
    <path d="M106 61 Q116 54 126 61" fill="none" stroke="#24140b" stroke-width="1.8" stroke-linecap="round"/>
    <path d="M107 58 Q116 52 125 58" fill="none" stroke="#b38059" stroke-width="0.9" opacity="0.7"/>
    <path d="M78 65 Q85 68 92 65 M109 65 Q116 68 123 65" fill="none" stroke="#b38059" stroke-width="1.1" opacity="0.65"/>
      
      <g stroke="#7a7368" stroke-width="1.4" fill="url(#lens-sheen)">
        <ellipse cx="85" cy="61" rx="12.5" ry="7.2"/>
        <ellipse cx="116" cy="61" rx="12.5" ry="7.2"/>
        <line x1="97.5" y1="61" x2="103.5" y2="61"/>
        <line x1="65" y1="60" x2="72.5" y2="61"/>
        <line x1="128.5" y1="61" x2="135" y2="60"/>
      </g>
      <path d="M77 56 L82 66 M109 56 L114 66" stroke="#ffffff" stroke-width="1.2" opacity="0.35" stroke-linecap="round"/>
      
      <ellipse cx="101" cy="89" rx="10.2" ry="6.8" fill="#42120e" stroke="#2b100c" stroke-width="1.8"/>
      <path d="M93 84 H109" stroke="#f7efe2" stroke-width="2.4" stroke-linecap="round"/>
      <ellipse cx="101" cy="93" rx="6" ry="2.5" fill="#9e3b33"/>
    </g>
  </svg>