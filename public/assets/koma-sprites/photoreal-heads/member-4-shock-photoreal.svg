<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 240" width="800" height="960">
    <defs>
      <!-- 3D Volumetric Subsurface Face Gradient -->
      <radialGradient id="face-grad" cx="0.36" cy="0.32" r="0.65">
        <stop offset="0%" stop-color="#fae0c3"/>
        <stop offset="48%" stop-color="#e4b389"/>
        <stop offset="84%" stop-color="#a6734b"/>
        <stop offset="100%" stop-color="#664124"/>
      </radialGradient>
      <linearGradient id="neck-grad" x1="0" y1="0" x2="1" y2="0.6">
        <stop offset="0%" stop-color="#e4b389"/>
        <stop offset="60%" stop-color="#a6734b"/>
        <stop offset="100%" stop-color="#664124"/>
      </linearGradient>
      <radialGradient id="spec-grad" cx="0.5" cy="0.5" r="0.5">
        <stop offset="0%" stop-color="#ffffff" stop-opacity="0.55"/>
        <stop offset="100%" stop-color="#fae0c3" stop-opacity="0"/>
      </radialGradient>
      <radialGradient id="cheek-blush" cx="0.5" cy="0.5" r="0.5">
        <stop offset="0%" stop-color="#d46e5d" stop-opacity="0.32"/>
        <stop offset="100%" stop-color="#d46e5d" stop-opacity="0"/>
      </radialGradient>
      <linearGradient id="hair-grad" x1="0" y1="0" x2="0.3" y2="1">
        <stop offset="0%" stop-color="#3d3838"/>
        <stop offset="35%" stop-color="#141212"/>
        <stop offset="100%" stop-color="#0a0706"/>
      </linearGradient>
      <linearGradient id="frame-burgundy" x1="0" y1="0" x2="1" y2="1">
        <stop offset="0%" stop-color="#7a1e24"/>
        <stop offset="100%" stop-color="#1f1414"/>
      </linearGradient>
      <linearGradient id="lens-sheen" x1="0" y1="0" x2="1" y2="1">
        <stop offset="0%" stop-color="#ffffff" stop-opacity="0.18"/>
        <stop offset="50%" stop-color="#8cb8ff" stop-opacity="0.06"/>
        <stop offset="100%" stop-color="#000000" stop-opacity="0.08"/>
      </linearGradient>
      <filter id="soft-shadow" x="-10%" y="-10%" width="120%" height="120%">
        <feDropShadow dx="0" dy="3" stdDeviation="2.2" flood-color="#140b06" flood-opacity="0.55"/>
      </filter>
    </defs>

    <g id="photoreal-head-layer" transform="translate(0, -4) rotate(-2 100 70)" filter="url(#soft-shadow)">
      <path d="M64 62 L60 88 L72 82 Z M136 62 L140 88 L128 82 Z" fill="url(#hair-grad)"/>
      <!-- Volumetric Neck with Jaw Cast Shadow -->
      <path d="M84 88 L84 114 Q100 124 116 114 L116 88 Z" fill="url(#neck-grad)" stroke="#664124" stroke-width="1.4"/>
      <path d="M85 92 Q100 112 115 95 L115 106 Q100 118 85 104 Z" fill="#664124" opacity="0.55"/>

      <!-- Detailed Ears with Inner Concha Shading -->
      <ellipse cx="66" cy="66" rx="6.2" ry="11.8" fill="url(#face-grad)" stroke="#664124" stroke-width="1.5"/>
      <path d="M65 61 Q63 66 66 71" fill="none" stroke="#664124" stroke-width="1.4" opacity="0.7"/>
      <ellipse cx="134" cy="66" rx="6.2" ry="11.8" fill="url(#face-grad)" stroke="#664124" stroke-width="1.5"/>
      <path d="M135 61 Q137 66 134 71" fill="none" stroke="#664124" stroke-width="1.4" opacity="0.7"/>

      <!-- 3D Shaded Cranium & Jaw -->
      <path d="M68 58 C68 18, 132 18, 132 58 C132 92, 118 109, 100 109 C82 109, 68 92, 68 58 Z" fill="url(#face-grad)" stroke="#664124" stroke-width="1.6"/>

      <!-- Subsurface Cheek & Nose Bridge Highlights -->
      <ellipse cx="79" cy="74" rx="11" ry="8" fill="url(#cheek-blush)"/>
      <ellipse cx="121" cy="74" rx="11" ry="8" fill="url(#cheek-blush)"/>
      <ellipse cx="80" cy="69" rx="7" ry="4" fill="url(#spec-grad)"/>
      <ellipse cx="120" cy="69" rx="7" ry="4" fill="url(#spec-grad)"/>

      <!-- Nasolabial & Eye Socket Volumetric Contours -->
      <path d="M88 76 Q83 83 84 91 M112 76 Q117 83 116 91" fill="none" stroke="#a6734b" stroke-width="1.1" opacity="0.55" stroke-linecap="round"/>

      <!-- 3D Shaded Nose Bridge, Tip Highlight & Nostrils -->
      <path d="M97 56 L93 73 Q100 78 107 73 L103 56 Z" fill="#a6734b" opacity="0.28"/>
      <path d="M100 55 L100 71" stroke="url(#spec-grad)" stroke-width="3.2" stroke-linecap="round"/>
      <circle cx="100" cy="71.5" r="2.8" fill="url(#spec-grad)"/>
      <path d="M93.5 73.5 Q96.5 76 98.5 74.5 M106.5 73.5 Q103.5 76 101.5 74.5" fill="none" stroke="#664124" stroke-width="1.6" stroke-linecap="round"/>

      
      <path d="M64 62 C59 22, 79 10, 102 11 C125 12, 141 25, 136 62 C131 37, 121 25, 100 25 C79 25, 69 37, 64 62 Z" fill="url(#hair-grad)"/>
      <path d="M74 22 Q96 13 122 22" fill="none" stroke="#3d3838" stroke-width="2.5" opacity="0.55" stroke-linecap="round"/>
      <path d="M88 23 Q79 36 83 49 M108 23 Q118 36 113 50" fill="none" stroke="#141212" stroke-width="2.6" stroke-linecap="round"/>
      <path d="M89 100 Q101 112 113 100 Q106 106 101 106 Q96 106 89 100 Z" fill="url(#hair-grad)"/>
      
      <path d="M70 41 Q84 33 96 42" fill="none" stroke="#141212" stroke-width="3.6" stroke-linecap="round"/>
      <path d="M106 42 Q118 33 132 41" fill="none" stroke="#141212" stroke-width="3.6" stroke-linecap="round"/>
      <path d="M82 32 Q101 29 120 32 M85 36 Q101 33 117 36" fill="none" stroke="#a6734b" stroke-width="1" opacity="0.7"/>
      
      <ellipse cx="85" cy="61" rx="6.8" ry="5.8" fill="#ffffff" stroke="#24140b" stroke-width="1.6"/>
      <circle cx="86" cy="61" r="2.6" fill="#1f140e"/><circle cx="85.2" cy="60.2" r="0.9" fill="#fff"/>
      <ellipse cx="116" cy="61" rx="6.8" ry="5.8" fill="#ffffff" stroke="#24140b" stroke-width="1.6"/>
      <circle cx="116" cy="61" r="2.6" fill="#1f140e"/><circle cx="115.2" cy="60.2" r="0.9" fill="#fff"/>
      
      
      <ellipse cx="101" cy="90" rx="11" ry="8.2" fill="#3d100c" stroke="#240b08" stroke-width="1.8"/>
      <path d="M93 84 H109" stroke="#f7efe2" stroke-width="2" stroke-linecap="round"/>
      <ellipse cx="101" cy="95" rx="6.5" ry="3" fill="#9e3b33"/>
    </g>
  </svg>