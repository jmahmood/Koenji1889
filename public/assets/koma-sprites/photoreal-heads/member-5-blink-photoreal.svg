<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 240" width="800" height="960">
    <defs>
      <!-- 3D Volumetric Subsurface Face Gradient -->
      <radialGradient id="face-grad" cx="0.36" cy="0.32" r="0.65">
        <stop offset="0%" stop-color="#ffebd4"/>
        <stop offset="48%" stop-color="#ebbd96"/>
        <stop offset="84%" stop-color="#ad7b54"/>
        <stop offset="100%" stop-color="#6b4528"/>
      </radialGradient>
      <linearGradient id="neck-grad" x1="0" y1="0" x2="1" y2="0.6">
        <stop offset="0%" stop-color="#ebbd96"/>
        <stop offset="60%" stop-color="#ad7b54"/>
        <stop offset="100%" stop-color="#6b4528"/>
      </linearGradient>
      <radialGradient id="spec-grad" cx="0.5" cy="0.5" r="0.5">
        <stop offset="0%" stop-color="#ffffff" stop-opacity="0.55"/>
        <stop offset="100%" stop-color="#ffebd4" stop-opacity="0"/>
      </radialGradient>
      <radialGradient id="cheek-blush" cx="0.5" cy="0.5" r="0.5">
        <stop offset="0%" stop-color="#e07668" stop-opacity="0.32"/>
        <stop offset="100%" stop-color="#e07668" stop-opacity="0"/>
      </radialGradient>
      <linearGradient id="hair-grad" x1="0" y1="0" x2="0.3" y2="1">
        <stop offset="0%" stop-color="#453936"/>
        <stop offset="35%" stop-color="#171312"/>
        <stop offset="100%" stop-color="#0a0706"/>
      </linearGradient>
      <linearGradient id="frame-burgundy" x1="0" y1="0" x2="1" y2="1">
        <stop offset="0%" stop-color="#7a1e24"/>
        <stop offset="100%" stop-color="#1f1414"/>
      </linearGradient>
      <linearGradient id="lens-sheen" x1="0" y1="0" x2="1" y2="1">
        <stop offset="0%" stop-color="#ffffff" stop-opacity="0.18"/>
        <stop offset="50%" stop-color="#8cb8ff" stop-opacity="0.06"/>
        <stop offset="100%" stop-color="#000000" stop-opacity="0.08"/>
      </linearGradient>
      <filter id="soft-shadow" x="-10%" y="-10%" width="120%" height="120%">
        <feDropShadow dx="0" dy="3" stdDeviation="2.2" flood-color="#140b06" flood-opacity="0.55"/>
      </filter>
    </defs>

    <g id="photoreal-head-layer"  filter="url(#soft-shadow)">
      <path d="M61 55 C59 83, 64 98, 74 100 L126 100 C136 98, 141 83, 139 55 Z" fill="url(#hair-grad)"/>
      <!-- Volumetric Neck with Jaw Cast Shadow -->
      <path d="M84 88 L84 114 Q100 124 116 114 L116 88 Z" fill="url(#neck-grad)" stroke="#6b4528" stroke-width="1.4"/>
      <path d="M85 92 Q100 112 115 95 L115 106 Q100 118 85 104 Z" fill="#6b4528" opacity="0.55"/>

      <!-- Detailed Ears with Inner Concha Shading -->
      <ellipse cx="66" cy="66" rx="6.2" ry="11.8" fill="url(#face-grad)" stroke="#6b4528" stroke-width="1.5"/>
      <path d="M65 61 Q63 66 66 71" fill="none" stroke="#6b4528" stroke-width="1.4" opacity="0.7"/>
      <ellipse cx="134" cy="66" rx="6.2" ry="11.8" fill="url(#face-grad)" stroke="#6b4528" stroke-width="1.5"/>
      <path d="M135 61 Q137 66 134 71" fill="none" stroke="#6b4528" stroke-width="1.4" opacity="0.7"/>

      <!-- 3D Shaded Cranium & Jaw -->
      <path d="M68 58 C68 18, 132 18, 132 58 C132 92, 118 109, 100 109 C82 109, 68 92, 68 58 Z" fill="url(#face-grad)" stroke="#6b4528" stroke-width="1.6"/>

      <!-- Subsurface Cheek & Nose Bridge Highlights -->
      <ellipse cx="79" cy="74" rx="11" ry="8" fill="url(#cheek-blush)"/>
      <ellipse cx="121" cy="74" rx="11" ry="8" fill="url(#cheek-blush)"/>
      <ellipse cx="80" cy="69" rx="7" ry="4" fill="url(#spec-grad)"/>
      <ellipse cx="120" cy="69" rx="7" ry="4" fill="url(#spec-grad)"/>

      <!-- Nasolabial & Eye Socket Volumetric Contours -->
      <path d="M88 76 Q83 83 84 91 M112 76 Q117 83 116 91" fill="none" stroke="#ad7b54" stroke-width="1.1" opacity="0.55" stroke-linecap="round"/>

      <!-- 3D Shaded Nose Bridge, Tip Highlight & Nostrils -->
      <path d="M97 56 L93 73 Q100 78 107 73 L103 56 Z" fill="#ad7b54" opacity="0.28"/>
      <path d="M100 55 L100 71" stroke="url(#spec-grad)" stroke-width="3.2" stroke-linecap="round"/>
      <circle cx="100" cy="71.5" r="2.8" fill="url(#spec-grad)"/>
      <path d="M93.5 73.5 Q96.5 76 98.5 74.5 M106.5 73.5 Q103.5 76 101.5 74.5" fill="none" stroke="#6b4528" stroke-width="1.6" stroke-linecap="round"/>

      
      <path d="M62 62 C60 20, 81 12, 100 12 C119 12, 140 20, 138 62 C128 37, 114 26, 98 25 C83 26, 71 37, 62 62 Z" fill="url(#hair-grad)"/>
      <path d="M70 28 Q86 16 104 20 M102 18 Q120 20 130 34" fill="none" stroke="#453936" stroke-width="2.4" opacity="0.6" stroke-linecap="round"/>
      
      
    <path d="M72 53 C78 47, 89 47, 97 53 C89 50, 79 50, 72 53 Z" fill="#171312"/>
    <path d="M105 53 C113 47, 124 47, 130 53 C123 50, 113 50, 105 53 Z" fill="#171312"/>
      
    <!-- Closed Eyelid Blink Variant (Preserves Glasses) -->
    <path d="M76 62 Q85 66 94 62" fill="none" stroke="#24140b" stroke-width="2.2" stroke-linecap="round"/>
    <path d="M77 59 Q85 62 93 59" fill="none" stroke="#8c5228" stroke-width="1.0" opacity="0.7"/>
    <path d="M107 62 Q116 66 125 62" fill="none" stroke="#24140b" stroke-width="2.2" stroke-linecap="round"/>
    <path d="M108 59 Q116 62 124 59" fill="none" stroke="#8c5228" stroke-width="1.0" opacity="0.7"/>
      
      
    <path d="M89 88 Q95 85 101 87 Q107 85 113 88 Q101 90 89 88 Z" fill="#994d47"/>
    <path d="M90 88 Q101 95 112 88 Q101 91 90 88 Z" fill="#c76b63"/>
    <path d="M95 90 Q101 92 107 90" fill="none" stroke="#ffdfcf" stroke-width="0.8" opacity="0.5"/>
    <path d="M88 88 Q101 91 114 88" fill="none" stroke="#361912" stroke-width="1.3" stroke-linecap="round"/>
    </g>
  </svg>