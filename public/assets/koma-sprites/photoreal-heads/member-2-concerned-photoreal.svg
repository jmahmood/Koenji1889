    <defs>
      <!-- 3D Volumetric Subsurface Face Gradient -->
      <radialGradient id="face-grad" cx="0.36" cy="0.32" r="0.65">
        <stop offset="0%" stop-color="#f5c99a"/>
        <stop offset="48%" stop-color="#d99e6c"/>
        <stop offset="84%" stop-color="#996035"/>
        <stop offset="100%" stop-color="#5e371a"/>
      </radialGradient>
      <linearGradient id="neck-grad" x1="0" y1="0" x2="1" y2="0.6">
        <stop offset="0%" stop-color="#d99e6c"/>
        <stop offset="60%" stop-color="#996035"/>
        <stop offset="100%" stop-color="#5e371a"/>
      </linearGradient>
      <radialGradient id="spec-grad" cx="0.5" cy="0.5" r="0.5">
        <stop offset="0%" stop-color="#ffffff" stop-opacity="0.55"/>
        <stop offset="100%" stop-color="#f5c99a" stop-opacity="0"/>
      </radialGradient>
      <radialGradient id="cheek-blush" cx="0.5" cy="0.5" r="0.5">
        <stop offset="0%" stop-color="#cf6855" stop-opacity="0.32"/>
