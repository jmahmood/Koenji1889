<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Kemonito · Money Ceremony Check</title>
<link rel="stylesheet" href="/src/style.css"><link rel="stylesheet" href="/src/appearance.css"><link rel="stylesheet" href="/src/playtest.css"><link rel="stylesheet" href="/src/kemonito.css">
<style>body{display:block;overflow:auto;margin:0;padding:16px;background:#241b13;color:#efdcba}header{display:flex;gap:14px;align-items:center;flex-wrap:wrap;margin:0 0 16px}header button,header select{font:inherit;padding:8px}.stage-holder{width:min(1100px,100%);height:510px}.stage-holder .clubroom-stage{height:100%}.validation-note{font:13px system-ui;margin:12px 0}#notice{min-height:24px}</style></head><body>
<header><b>Kemonito · Money distribution</b><button id="play">Distribute money</button><button id="skip">Skip ceremony</button><label>Players <select id="seats"><option>2</option><option selected>4</option><option>6</option></select></label><label><input id="motion" type="checkbox" checked> Motion</label></header>
<div class="stage-holder" id="stage"></div><p class="validation-note">Isolated visual fixture · no game is created and no balances are changed.</p><p class="validation-note" id="notice" role="status"></p>
<script type="module">
import {renderClubRoomScene} from '/src/scene/ClubRoom.js';
import {renderCashDelivery} from '/src/ui/playtestUX.js';
import {CharacterPlayback} from '/src/ui/characterController.js';
import {buildEventSequence} from '/src/ui/characterEvents.js';
import {setCharacterPresentationResolver,refreshCharacterSlots} from '/src/scene/Character.js';
const host=document.querySelector('#stage');let view,serial=0;
function patch(){refreshCharacterSlots(document);const slot=document.querySelector('[data-cash-receipt-stage]');if(slot)slot.innerHTML=renderCashDelivery(view,playback,{atTable:true});const job=playback.lanes.get('game')?.active;const sample=job&&playback.sample(job);document.querySelector('#notice').textContent=sample?`Kemonito pose ${sample.frame.kemonito?.pose ?? 'preparation'} · ${sample.frame.receipt?.name || 'Dividend confirmed'}`:'Ready';}
const playback=new CharacterPlayback({onChange:patch});
setCharacterPresentationResolver(id=>playback.poseFor(id));
function reset(){playback.clear();const n=Number(document.querySelector('#seats').value),order=Array.from({length:n},(_,i)=>'p'+(i+1));
const names=['Daisuke','Haruka','Kenji','Alex','Yumiko','Guest'];
view={state:{player_order:order,players:Object.fromEntries(order.map((p,i)=>[p,{id:p,name:names[i],cash:420}])),corporations:{},privates:{},board:{},auction:{},round:'stock',phase:'2',revision:1,current_player:'p1'},members:Object.fromEntries(order.map((p,i)=>[p,{member_id:'person:'+p,appearance:{face:'reference-'+String(i+1).padStart(2,'0'),clothes:['indigo-haori','plum-kimono','charcoal-suit','moss-hakama'][i%4]}}])),viewer:{player_id:'p1'},club:{stamps:{},notes:[]}};
const shell=document.createElement('div');shell.innerHTML=renderClubRoomScene({viewRevision:1,liveRevision:1},view);host.replaceChildren(shell.querySelector('.clubroom-stage'));const delivery=document.createElement('div');delivery.className='cash-receipt-stage is-at-table';delivery.dataset.cashReceiptStage='';host.querySelector('.clubroom-stage').append(delivery);patch();}
document.querySelector('#play').onclick=()=>{playback.clear();playback.enqueue(buildEventSequence({type:'dividend',actor_id:'p1',corporation:'IR',payout:true,revenue:120,label:'Dividend confirmed',cash_receipts:view.state.player_order.map((p,i)=>({recipient:p,name:view.state.players[p].name,destination:'purse',amount:i===0?60:30}))},view),{id:'fixture:'+ ++serial});};
document.querySelector('#skip').onclick=()=>playback.clear();document.querySelector('#seats').onchange=reset;document.querySelector('#motion').onchange=e=>playback.setMotionEnabled(e.target.checked);reset();
</script></body></html>
